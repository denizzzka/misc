name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SUBPACKAGES: random socket_stuff lockfree

jobs:
  test-native:
    name: ${{ matrix.job_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - job_name: Linux x86_64 dmd
            os: ubuntu-latest
            dc: dmd-latest
          - job_name: Linux x86_64 ldc
            os: ubuntu-latest
            dc: ldc-latest
          # Like LDC, test ARM on a native aarch64 runner; DMD ships no
          # linux-aarch64 builds, LDC does.
          - job_name: Linux aarch64 ldc
            os: ubuntu-24.04-arm
            dc: ldc-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up D
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.dc }}

      - name: Show target
        run: |
          set -euo pipefail
          uname -m
          dub --version
          # sed consumes the whole stream; piping to `head` closes the pipe
          # early and LDC dies writing the rest of its version banner.
          "$DC" --version | sed -n 1p

      - name: Build and test subpackages
        run: |
          set -euo pipefail
          for pkg in $SUBPACKAGES; do
            echo "::group::$pkg"
            (cd "$pkg" && dub test)
            echo "::endgroup::"
          done

  # No 32-bit ARM runners are hosted, so armv7 gets a cross build instead of
  # running the unittests.
  cross-armv7:
    name: cross armv7a
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up D
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest

      - name: Build for armv7a
        env:
          DFLAGS: -mtriple=armv7a-unknown-linux-gnueabihf -unittest
        run: |
          set -euo pipefail
          for pkg in $SUBPACKAGES; do
            echo "::group::$pkg"
            (
              cd "$pkg"
              dub build --force
              lib="lib$pkg.a"
              obj="$(ar t "$lib" | sed -n 1p)"
              desc="$(ar p "$lib" "$obj" | file -)"
              echo "$desc"
              grep -q 'ELF 32-bit.*ARM' <<<"$desc"
            )
            echo "::endgroup::"
          done
